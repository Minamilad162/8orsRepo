<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#244326"/><meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="عجلة غرس"/>
<meta name="description" content="عجلة غرس التفاعلية — لف العجلة واكتشف نصيبك"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png"/>
<link rel="icon" type="image/png" href="/ghars-logo.png"/>
<link rel="stylesheet" href="/assets/main.css"/>
<title>عجلة غرس | Ghars Spin Wheel</title></head>
<body><div id="root"><div class="app-shell">
  <div class="app-noise" aria-hidden="true"></div>
  <div class="bg-sun bg-sun-one" aria-hidden="true"></div>
  <div class="bg-sun bg-sun-two" aria-hidden="true"></div>
  <header class="site-header page-width">
    <div class="brand"><img class="brand-logo" data-ghars-logo alt="شعار غرس"/><div class="brand-rule"></div>
    <div class="brand-slogan"><strong>نغرس اليوم...</strong><strong>لنحصد أجيالًا</strong></div></div>
    <div class="top-actions"><span class="event-note experience-pill"><span class="live-dot"></span>GHARS EXPERIENCE</span>
      <button id="sound-btn" class="icon-button" type="button" aria-label="تشغيل الصوت" title="تشغيل الصوت"><span id="sound-icon">🔇</span></button>
      <button id="fullscreen-btn" class="icon-button" type="button" aria-label="ملء الشاشة" title="ملء الشاشة"><span id="fullscreen-icon">⛶</span></button>
    </div>
  </header>
  <main class="main-content page-width"><section class="game-panel" aria-label="عجلة حظ غرس">
    <div class="wheel-topline"><span>🌿 يا ترى هيقف على إيه؟</span><span class="wheel-topline-stars">✦ ✧ ✦</span></div>
    <div class="wheel-stage" id="wheel-stage">
      <div class="wheel-outer-glow"></div>
      <div class="wheel-pointer" aria-hidden="true"><span class="wheel-pointer-top"></span><span class="wheel-pointer-tip"></span></div>
      <div class="wheel-dial" id="wheel-dial"><svg id="wheel-svg" viewBox="0 0 560 560" class="wheel-svg" role="img" aria-label="عجلة غرس بها ست خانات للهدايا والأسئلة"></svg></div>
      <button id="wheel-hub" class="wheel-hub" type="button" aria-label="اضغط على شعار غرس لبدء لف العجلة">
        <span class="wheel-hub-inner"><img data-ghars-logo alt=""/></span><span id="hub-tap" class="hub-tap" aria-hidden="true">دوس هنا</span>
      </button>
      <span class="wheel-spark wheel-spark-a" aria-hidden="true">✦</span>
      <span class="wheel-spark wheel-spark-b" aria-hidden="true">✦</span>
      <span class="wheel-spark wheel-spark-c" aria-hidden="true">✧</span>
    </div>
    <div id="offline-status" class="offline-status offline-pending" role="status" aria-live="polite">
      <span class="offline-led" aria-hidden="true"></span><span id="offline-label">جاري تجهيز وضع بدون نت...</span>
      <button id="install-btn" class="install-app-button" type="button" hidden>ثبّت العجلة على الموبايل</button>
    </div>
  </section></main>
  <footer class="site-footer page-width"><span>غرس 🌱 نغرس اليوم... لنحصد أجيالًا</span><span>SAME FAITH • NEW IDEAS <span class="footer-spark">✳</span></span></footer>
  <div id="result-root"></div>
</div></div><script src="/assets/main.js" defer></script></body></html>
